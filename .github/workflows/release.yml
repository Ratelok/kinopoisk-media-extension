name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run test suite
        run: npm test

      - name: Build artifacts (.zip and .xpi)
        run: |
          npm run package
          if unzip -l dist/kinopoisk-mediastack.xpi 2>/dev/null | grep -q 'META-INF/mozilla.rsa'; then
            echo "Preserving existing Mozilla-signed .xpi binary"
          else
            npm run build:xpi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kinopoisk-mediastack.zip
            dist/kinopoisk-mediastack.xpi
          generate_release_notes: true
          draft: false
          prerelease: false
