<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="50%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>

    <!-- Kinopoisk Accent Gradient -->
    <linearGradient id="kp-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5500"/>
      <stop offset="70%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#d6bb00"/>
    </linearGradient>

    <!-- Jellyfin Blue Gradient -->
    <linearGradient id="jf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a4dc"/>
      <stop offset="100%" stop-color="#aa5cc3"/>
    </linearGradient>

    <!-- Jellyseerr Purple Gradient -->
    <linearGradient id="js-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Subtle Button Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff5500" flood-opacity="0.25"/>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>

  <!-- Subtle Accent Orbs -->
  <circle cx="200" cy="100" r="160" fill="#ff5500" opacity="0.07" filter="blur(60px)"/>
  <circle cx="1000" cy="300" r="180" fill="#6366f1" opacity="0.08" filter="blur(60px)"/>

  <!-- Top Badges / Ecosystem Links -->
  <g transform="translate(60, 48)">
    <!-- Kinopoisk Pill -->
    <rect width="130" height="34" rx="17" fill="rgba(255,85,0,0.15)" stroke="rgba(255,85,0,0.4)" stroke-width="1"/>
    <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ff6611" text-anchor="middle">КИНОПОИСК</text>

    <!-- Plus Symbol -->
    <text x="155" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#666" text-anchor="middle">+</text>

    <!-- Jellyseerr Pill -->
    <g transform="translate(180, 0)">
      <rect width="130" height="34" rx="17" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
      <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">Jellyseerr</text>
    </g>

    <!-- Plus Symbol -->
    <text x="335" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#666" text-anchor="middle">+</text>

    <!-- Jellyfin Pill -->
    <g transform="translate(360, 0)">
      <rect width="110" height="34" rx="17" fill="rgba(0,164,220,0.15)" stroke="rgba(0,164,220,0.4)" stroke-width="1"/>
      <text x="55" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">Jellyfin</text>
    </g>

    <!-- Firefox Add-on Badge on right -->
    <g transform="translate(930, 0)">
      <rect width="150" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <circle cx="24" cy="17" r="7" fill="#ff7139"/>
      <text x="88" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0" text-anchor="middle">Firefox Extension</text>
    </g>
  </g>

  <!-- Main Hero Titles -->
  <text x="60" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5px">
    Kinopoisk MediaStack
  </text>
  <text x="60" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Бесшовная интеграция Кинопоиска с вашим домашним сервером: запрос в один клик и прямой просмотр.
  </text>

  <!-- Interactive Button Previews Showcase Area -->
  <g transform="translate(60, 240)">
    <!-- Container Card -->
    <rect width="1080" height="130" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#subtle-shadow)"/>

    <!-- Native Kinopoisk "Буду смотреть" (Reference) -->
    <g transform="translate(28, 38)">
      <rect width="168" height="52" rx="26" fill="rgba(255,255,255,0.1)"/>
      <!-- Bookmark icon -->
      <path d="M12 17l-5 3V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14l-5-3z" fill="#ffffff" transform="translate(18, 14) scale(1)"/>
      <text x="100" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Буду смотреть</text>
    </g>

    <!-- Injected "Смотреть в Jellyfin" Button (Primary) -->
    <g transform="translate(216, 38)" filter="url(#glow)">
      <rect width="250" height="52" rx="26" fill="url(#kp-accent)"/>
      <!-- Canonical Play Triangle -->
      <svg x="20" y="14" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M6 3.375 21 12 6 20.625V3.375Z" fill="#ffffff"/>
      </svg>
      <text x="145" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Смотреть в Jellyfin</text>
    </g>

    <!-- Injected "Скачан" Badge -->
    <g transform="translate(486, 38)">
      <rect width="128" height="52" rx="26" fill="rgba(255,255,255,0.1)"/>
      <!-- Check icon -->
      <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#10b981" transform="translate(18, 14)"/>
      <text x="78" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Скачан</text>
    </g>

    <!-- Injected "Скачать" Button (Secondary) -->
    <g transform="translate(634, 38)">
      <rect width="138" height="52" rx="26" fill="rgba(255,255,255,0.1)"/>
      <!-- Download Cloud icon -->
      <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z" fill="#ffffff" transform="translate(18, 14) scale(0.9)"/>
      <text x="86" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Скачать</text>
    </g>

    <!-- Injected "Качается 64%" Progress Badge -->
    <g transform="translate(792, 38)">
      <rect width="180" height="52" rx="26" fill="rgba(255,255,255,0.1)"/>
      <!-- Clip path for progress bar inside pill -->
      <rect x="0" y="48" width="115" height="4" rx="2" fill="#0284c7"/>
      <!-- Download arrow icon -->
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14l-4-4h3V8h2v4h3l-4 4z" fill="#38bdf8" transform="translate(18, 14) scale(0.9)"/>
      <text x="106" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Качается 64%</text>
    </g>

    <!-- "..." Button (Native Reference) -->
    <g transform="translate(992, 38)">
      <rect width="52" height="52" rx="26" fill="rgba(255,255,255,0.1)"/>
      <circle cx="16" cy="26" r="2.5" fill="#ffffff"/>
      <circle cx="26" cy="26" r="2.5" fill="#ffffff"/>
      <circle cx="36" cy="26" r="2.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
